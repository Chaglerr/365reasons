<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>365 მიზეზი დასალევად</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;600;800&family=Noto+Sans+Georgian:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg-1: #1a1208;
    --bg-2: #2a1a0c;
    --card: rgba(255, 245, 220, 0.05);
    --card-border: rgba(255, 200, 120, 0.18);
    --gold: #f4c66b;
    --gold-soft: #d9a64a;
    --amber: #c47a2e;
    --text: #f7ecd6;
    --text-dim: #c8b48f;
    --text-mute: #8a7a5e;
  }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #3a2410 0%, transparent 60%),
      radial-gradient(ellipse at bottom right, #4a2a10 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    font-family: "Noto Sans Georgian", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  header.hero {
    text-align: center;
    margin-bottom: 40px;
  }
  .brand {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-bottom: 8px;
  }
  h1 {
    font-family: "Noto Serif Georgian", serif;
    font-weight: 800;
    font-size: clamp(32px, 6vw, 56px);
    margin: 0 0 12px;
    background: linear-gradient(135deg, #ffe1a8 0%, #f4c66b 50%, #c47a2e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.3;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: clamp(14px, 2vw, 17px);
    margin: 0;
  }

  .today-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: clamp(28px, 5vw, 48px);
    backdrop-filter: blur(8px);
    box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 220, 160, 0.08);
    overflow: hidden;
  }
  .today-card::before {
    content: "";
    position: absolute;
    top: -50%;
    right: -20%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(244, 198, 107, 0.18), transparent 60%);
    pointer-events: none;
  }
  .today-label {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
    font-weight: 600;
  }
  .today-date {
    font-family: "Noto Serif Georgian", serif;
    font-size: clamp(20px, 3vw, 26px);
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 20px;
  }
  .today-reason {
    font-family: "Noto Serif Georgian", serif;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
    margin: 0 0 28px;
  }
  .today-toast {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--gold-soft);
    font-style: italic;
    font-size: 15px;
  }
  .today-toast::before { content: "🥃"; font-size: 22px; }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid rgba(255, 200, 120, 0.12);
  }
  .nav-btn {
    background: rgba(255, 200, 120, 0.08);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .nav-btn:hover {
    background: rgba(244, 198, 107, 0.18);
    border-color: var(--gold);
    color: var(--gold);
  }
  .nav-btn.today {
    background: linear-gradient(135deg, var(--gold), var(--amber));
    border-color: transparent;
    color: #2a1a0c;
    font-weight: 700;
  }
  .nav-btn.today:hover { filter: brightness(1.1); }

  .browse {
    margin-top: 64px;
  }
  .browse-title {
    font-family: "Noto Serif Georgian", serif;
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--text);
  }
  .browse-sub {
    color: var(--text-mute);
    margin: 0 0 24px;
    font-size: 14px;
  }

  .months {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .month-btn {
    background: rgba(255, 245, 220, 0.04);
    border: 1px solid rgba(255, 200, 120, 0.12);
    color: var(--text-dim);
    padding: 8px 16px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .month-btn:hover {
    color: var(--gold);
    border-color: var(--gold-soft);
  }
  .month-btn.active {
    background: linear-gradient(135deg, var(--gold), var(--amber));
    color: #2a1a0c;
    border-color: transparent;
    font-weight: 700;
  }

  .days {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 10px;
  }
  .day-cell {
    aspect-ratio: 1 / 1;
    background: rgba(255, 245, 220, 0.04);
    border: 1px solid rgba(255, 200, 120, 0.1);
    border-radius: 12px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
    position: relative;
  }
  .day-cell:hover {
    background: rgba(244, 198, 107, 0.12);
    color: var(--gold);
    border-color: var(--gold-soft);
    transform: translateY(-2px);
  }
  .day-cell.selected {
    background: linear-gradient(135deg, var(--gold), var(--amber));
    color: #2a1a0c;
    border-color: transparent;
  }
  .day-cell.today::after {
    content: "";
    position: absolute;
    top: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }
  .day-cell.selected.today::after { background: #2a1a0c; box-shadow: none; }

  footer {
    text-align: center;
    color: var(--text-mute);
    font-size: 13px;
    margin-top: 64px;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    .nav-row { flex-wrap: wrap; }
    .nav-btn { flex: 1; min-width: 0; }
    .nav-btn.today { flex-basis: 100%; order: -1; margin-bottom: 4px; }
    .days { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); }
    .day-cell { font-size: 15px; border-radius: 10px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="brand">365 ☉ Reasons</div>
      <h1>365 მიზეზი დასალევად</h1>
      <br/>
      <p class="subtitle">ყოველ დღეს თავისი მიზეზი აქვს.</p>
    </header>

    <section class="today-card">

      <div class="today-toast">გაუმარჯოს!</div>

      <div class="nav-row">

        <button class="nav-btn today" id="todayBtn">დღეს</button>
        <button class="nav-btn" id="nextBtn">შემდეგი დღე →</button>

    <section class="browse">

      <p class="browse-sub">აირჩიე თვე და დღე</p>
      <div class="months" id="months"></div>
      <div class="days" id="days"></div>
    </section>

    <footer>365 დღე, 365 მიზეზი</footer>
  </div>

const today = new Date();
const todayMonth = today.getMonth();
const todayDay = today.getDate();

let selMonth = todayMonth;
let selDay = todayDay;

function reasonFor(m, d) {
  const arr = REASONS[m];
  if (!arr) return "—";
  return arr[Math.min(d - 1, arr.length - 1)] || "—";
}

function isToday(m, d) {
  return m === todayMonth && d === todayDay;
}

function renderTodayCard() {
  document.getElementById("todayLabel").textContent =
    isToday(selMonth, selDay) ? "დღევანდელი მიზეზი" : "არჩეული დღე";
  document.getElementById("dateText").textContent =
    selDay + " " + MONTHS[selMonth];
  document.getElementById("reasonText").textContent =
    reasonFor(selMonth, selDay);
}

function renderMonths() {
  const wrap = document.getElementById("months");
  wrap.innerHTML = "";
  MONTHS.forEach((name, i) => {
    const btn = document.createElement("button");
    btn.className = "month-btn" + (i === selMonth ? " active" : "");
    btn.textContent = name;
    btn.addEventListener("click", () => {
      selMonth = i;
      if (selDay > DAYS_IN_MONTH[i]) selDay = DAYS_IN_MONTH[i];
      renderAll();
    });
    wrap.appendChild(btn);
  });
}

function renderDays() {
  const wrap = document.getElementById("days");
  wrap.innerHTML = "";
  const count = DAYS_IN_MONTH[selMonth];
  for (let d = 1; d <= count; d++) {
    const cell = document.createElement("button");
    let cls = "day-cell";
    if (d === selDay) cls += " selected";
    if (isToday(selMonth, d)) cls += " today";
    cell.className = cls;
    cell.textContent = d;
    cell.addEventListener("click", () => {
      selDay = d;
      renderAll();
    });
    wrap.appendChild(cell);
  }
}

function renderAll() {
  renderTodayCard();
  renderMonths();
  renderDays();
}

document.getElementById("prevBtn").addEventListener("click", () => {
  selDay--;
  if (selDay < 1) {
    selMonth = (selMonth - 1 + 12) % 12;
    selDay = DAYS_IN_MONTH[selMonth];
  }
  renderAll();
});

document.getElementById("nextBtn").addEventListener("click", () => {
  selDay++;
  if (selDay > DAYS_IN_MONTH[selMonth]) {
    selMonth = (selMonth + 1) % 12;
    selDay = 1;
  }
  renderAll();
});

document.getElementById("todayBtn").addEventListener("click", () => {
  selMonth = todayMonth;
  selDay = todayDay;
  renderAll();
});

renderAll();
</script>
